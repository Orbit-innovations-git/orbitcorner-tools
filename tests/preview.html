<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrbitCorner Tools: local preview</title>
  <link rel="stylesheet" href="../assets/oc-tools.css">
  <style>
    /* Stand-ins for the theme: Inter body, Plus Jakarta Sans headings (if installed), sticky header. */
    body {
      margin: 0;
      background: #F8FAFC;
      color: #475569;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --global-heading-font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif;
    }
    .preview-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      height: 72px;
      padding: 0 24px;
      background: #FFFFFF;
      border-bottom: 1px solid #E2E8F0;
      color: #0F172A;
      font-weight: 700;
    }
    .preview-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }
    .preview-wrap h1 {
      margin: 0 0 24px;
      color: #0F172A;
      font-family: var(--global-heading-font-family);
      font-size: 32px;
      line-height: 1.2;
    }
    .preview-help code {
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.06);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="preview-header">OrbitCorner Tools · local preview (sticky header stand-in)</header>
  <main class="preview-wrap">
    <h1>Freelancer Take-Home Calculator</h1>
    <div class="oc-app" id="oc-app-take-home-1" data-oc-tool="take-home"></div>
  </main>

  <script>
    // In WordPress the plugin prints window.OCToolData; here we load the same rates.json,
    // then load the scripts in the same order as the plugin (calc.js, then app.js).
    (function () {
      'use strict';

      var app = document.getElementById('oc-app-take-home-1');

      function loadScript(src, done) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = done || null;
        document.body.appendChild(s);
      }

      function showHelp() {
        app.innerHTML =
          '<div class="oc-app-error preview-help">' +
            '<p><strong>The preview could not load <code>data/rates.json</code>.</strong></p>' +
            '<p>Browsers block this when the page is opened straight from a file. ' +
            'In a terminal, go to the plugin folder and run <code>python3 -m http.server 8000</code>, ' +
            'then open <code>http://localhost:8000/tests/preview.html</code>.</p>' +
          '</div>';
      }

      if (typeof fetch !== 'function') {
        showHelp();
        return;
      }
      fetch('../data/rates.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }
          return response.json();
        })
        .then(function (data) {
          window.OCToolData = data;
          loadScript('../tools/take-home/calc.js', function () {
            loadScript('../tools/take-home/app.js');
          });
        })
        .catch(showHelp);
    }());
  </script>
</body>
</html>
